[manifest]
id = "bm64_sudden_death_ghosts"
version = "1.0.0"
display_name = "Sudden Death Ghosts"
description = """
Players who die during Sudden Death come back as ghosts, when ghosts are enabled in the battle settings. \
In the unmodded game no ghosts appear once the battle timer has dropped below one minute."""
short_description = "Dead players still become ghosts during Sudden Death."
authors = [ "Mayo0x0" ]
game_id = "bm64"
minimum_recomp_version = "1.0.0"
dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "bm64_sudden_death_ghosts"
func_reference_syms_file = "../../BM64Syms/dump.toml"
data_reference_syms_files = [ "../../BM64Syms/data_dump.toml" ]
additional_files = []
