[manifest]
id = "bm64_battle_extra_bot"
version = "0.1.0"
display_name = "Battle Extra Bot (Prototype)"
description = """
Prototype: adds a fifth, computer-controlled bomber to every battle. \
It uses the same model as the last active player, does not appear on the HUD, cannot win and does not become a ghost."""
short_description = "Prototype: a fifth CPU bomber in battles."
authors = [ "Mayo0x0" ]
game_id = "bm64"
minimum_recomp_version = "1.0.0"
dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "bm64_battle_extra_bot"
func_reference_syms_file = "../../BM64Syms/dump.toml"
data_reference_syms_files = [ "../../BM64Syms/data_dump.toml" ]
additional_files = []
